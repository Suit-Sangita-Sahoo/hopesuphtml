<div id="footer-placeholder"></div>


<!-- HEADER LOADER -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    fetch("/Header.html")
        .then(function (response) {

            if (!response.ok) {
                throw new Error("Header.html could not be loaded.");
            }

            return response.text();

        })
        .then(function (data) {

            const headerPlaceholder =
                document.getElementById("header-placeholder");

            if (!headerPlaceholder) {
                return;
            }

            headerPlaceholder.innerHTML = data;

            const menuButton =
                document.getElementById("menuButton");

            const mobileMenu =
                document.getElementById("mobileMenu");

            const mobileApproachButton =
                document.getElementById("mobileApproachButton");

            const mobileServices =
                document.getElementById("mobileServices");

            const mobileApproach =
                document.querySelector(".mobile-approach");


            /*
             * MOBILE MAIN MENU
             */
            if (menuButton && mobileMenu) {

                menuButton.addEventListener("click", function () {

                    const isOpen =
                        mobileMenu.classList.toggle("show");

                    menuButton.setAttribute(
                        "aria-expanded",
                        String(isOpen)
                    );

                    menuButton.setAttribute(
                        "aria-label",
                        isOpen ? "Close menu" : "Open menu"
                    );

                });


                /*
                 * CLOSE MENU WHEN CLICKING ANY MOBILE LINK
                 */
                mobileMenu
                    .querySelectorAll("a")
                    .forEach(function (link) {

                        link.addEventListener("click", function () {

                            mobileMenu.classList.remove("show");

                            if (mobileServices) {
                                mobileServices.classList.remove("show");
                            }

                            if (mobileApproach) {
                                mobileApproach.classList.remove("open");
                            }

                            if (mobileApproachButton) {
                                mobileApproachButton.setAttribute(
                                    "aria-expanded",
                                    "false"
                                );
                            }

                            menuButton.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                            menuButton.setAttribute(
                                "aria-label",
                                "Open menu"
                            );

                        });

                    });

            }


            /*
             * MOBILE APPROACH DROPDOWN
             */
            if (
                mobileApproachButton &&
                mobileServices &&
                mobileApproach
            ) {

                mobileApproachButton.addEventListener(
                    "click",
                    function () {

                        const isOpen =
                            mobileServices.classList.toggle("show");

                        mobileApproach.classList.toggle(
                            "open",
                            isOpen
                        );

                        mobileApproachButton.setAttribute(
                            "aria-expanded",
                            String(isOpen)
                        );

                    }
                );

            }

        })
        .catch(function (error) {

            console.error(
                "Header loading error:",
                error
            );

        });


    /*
     * FOOTER LOADER
     */
    fetch("/Footer.html")
        .then(function (response) {

            if (!response.ok) {
                throw new Error("Footer.html could not be loaded.");
            }

            return response.text();

        })
        .then(function (data) {

            const footerPlaceholder =
                document.getElementById("footer-placeholder");

            if (!footerPlaceholder) {
                return;
            }

            footerPlaceholder.innerHTML = data;

        })
        .catch(function (error) {

            console.error(
                "Footer loading error:",
                error
            );

        });

});
</script>

</body>
