<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Graphic Design — Humans are visual creatures."
    >

    <title>Graphic Design — thehopesup</title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/Style/ServiceDetails.css"
    >

    <link
        rel="stylesheet"
        href="/Style/common.css"
    >

    <link
        rel="stylesheet"
        href="/Style/Footer.css"
    >


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         PAGE CSS
    ====================================================== -->

    <style>

        :root {
            --page-cream: #faf8f3;
            --page-soft: #f6f1eb;
            --page-white: #fffdf9;

            --page-ink: #241f19;
            --page-text: #4d463f;
            --page-muted: #8b8178;

            --page-amber: #c8791f;
            --page-orange: #e45b35;

            --page-line: rgba(36, 31, 25, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--page-cream);
            color: var(--page-ink);
            overflow-x: hidden;
        }

        main {
            background: var(--page-cream);
        }

        .container {
            width: min(1160px, calc(100% - 40px));
            margin: 0 auto;
        }

        /* Your existing Graphic Design CSS
           goes here */

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div id="header-placeholder"></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <!-- Your Graphic Design page content -->

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="footer-placeholder"></div>


    <!-- =====================================================
         HEADER + FOOTER LOADER
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   LOAD HEADER
                ================================================= */

                fetch(
                    "/Header.html?v=" + Date.now(),
                    {
                        cache: "no-store"
                    }
                )

                .then(function (response) {

                    if (!response.ok) {

                        throw new Error(
                            "Header.html could not be loaded. Status: " +
                            response.status
                        );

                    }

                    return response.text();

                })

                .then(function (data) {

                    const headerPlaceholder =
                        document.getElementById(
                            "header-placeholder"
                        );


                    if (!headerPlaceholder) {

                        console.error(
                            "Header placeholder not found."
                        );

                        return;

                    }


                    headerPlaceholder.innerHTML = data;


                    /* =================================================
                       MOBILE MENU
                    ================================================= */

                    const menuButton =
                        document.getElementById(
                            "menuButton"
                        );

                    const mobileMenu =
                        document.getElementById(
                            "mobileMenu"
                        );

                    const mobileApproachButton =
                        document.getElementById(
                            "mobileApproachButton"
                        );

                    const mobileServices =
                        document.getElementById(
                            "mobileServices"
                        );


                    if (
                        menuButton &&
                        mobileMenu
                    ) {

                        menuButton.addEventListener(
                            "click",
                            function (event) {

                                event.stopPropagation();


                                const isOpen =
                                    mobileMenu.classList.toggle(
                                        "show"
                                    );


                                menuButton.setAttribute(
                                    "aria-expanded",
                                    String(isOpen)
                                );


                                menuButton.setAttribute(
                                    "aria-label",
                                    isOpen
                                        ? "Close menu"
                                        : "Open menu"
                                );

                            }
                        );


                        /* =============================================
                           CLOSE AFTER LINK CLICK
                        ============================================== */

                        mobileMenu
                            .querySelectorAll("a")
                            .forEach(function (link) {

                                link.addEventListener(
                                    "click",
                                    function () {

                                        mobileMenu.classList.remove(
                                            "show"
                                        );


                                        if (mobileServices) {

                                            mobileServices.classList.remove(
                                                "show"
                                            );

                                        }


                                        if (
                                            mobileApproachButton
                                        ) {

                                            mobileApproachButton.classList.remove(
                                                "open"
                                            );

                                            mobileApproachButton.setAttribute(
                                                "aria-expanded",
                                                "false"
                                            );

                                        }


                                        menuButton.setAttribute(
                                            "aria-expanded",
                                            "false"
                                        );


                                        menuButton.setAttribute(
                                            "aria-label",
                                            "Open menu"
                                        );

                                    }
                                );

                            });

                    }


                    /* =================================================
                       MOBILE SERVICES
                    ================================================= */

                    if (
                        mobileApproachButton &&
                        mobileServices
                    ) {

                        mobileApproachButton.addEventListener(
                            "click",
                            function (event) {

                                event.stopPropagation();


                                const isOpen =
                                    mobileServices.classList.toggle(
                                        "show"
                                    );


                                mobileApproachButton.classList.toggle(
                                    "open",
                                    isOpen
                                );


                                mobileApproachButton.setAttribute(
                                    "aria-expanded",
                                    String(isOpen)
                                );

                            }
                        );

                    }


                    /* =================================================
                       CLOSE WHEN CLICKING OUTSIDE
                    ================================================= */

                    document.addEventListener(
                        "click",
                        function (event) {

                            if (
                                mobileMenu &&
                                menuButton &&
                                !mobileMenu.contains(
                                    event.target
                                ) &&
                                !menuButton.contains(
                                    event.target
                                )
                            ) {

                                mobileMenu.classList.remove(
                                    "show"
                                );


                                if (mobileServices) {

                                    mobileServices.classList.remove(
                                        "show"
                                    );

                                }


                                if (
                                    mobileApproachButton
                                ) {

                                    mobileApproachButton.classList.remove(
                                        "open"
                                    );

                                    mobileApproachButton.setAttribute(
                                        "aria-expanded",
                                        "false"
                                    );

                                }


                                menuButton.setAttribute(
                                    "aria-expanded",
                                    "false"
                                );

                                menuButton.setAttribute(
                                    "aria-label",
                                    "Open menu"
                                );

                            }

                        }
                    );

                })

                .catch(function (error) {

                    console.error(
                        "Header loading error:",
                        error
                    );

                });


                /* =================================================
                   LOAD FOOTER
                ================================================= */

                fetch(
                    "/Footer.html?v=" + Date.now(),
                    {
                        cache: "no-store"
                    }
                )

                .then(function (response) {

                    if (!response.ok) {

                        throw new Error(
                            "Footer.html could not be loaded. Status: " +
                            response.status
                        );

                    }

                    return response.text();

                })

                .then(function (data) {

                    const footerPlaceholder =
                        document.getElementById(
                            "footer-placeholder"
                        );


                    if (!footerPlaceholder) {

                        console.error(
                            "Footer placeholder not found."
                        );

                        return;

                    }


                    footerPlaceholder.innerHTML = data;

                })

                .catch(function (error) {

                    console.error(
                        "Footer loading error:",
                        error
                    );

                });

            }
        );

    </script>

</body>

</html>
